<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>개발한끼 뉴스레터 구독</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 스타일은 그대로 유지 */
        :root {
            --primary: #4e83f1;
            --bg: #f9fafb;
            --text-main: #1e1e1e;
            --text-sub: #777;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }

        .wrapper {
            max-width: 480px;
            margin: auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin: 0;
        }

        .header p {
            margin-top: 12px;
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        .info-box {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            font-size: 14px;
            line-height: 1.7;
        }

        .form-box {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
        }

        .form-box input,
        .form-box select {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        .form-box button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .form-box button:hover {
            background: #3a6fd9;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #999;
            text-align: center;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .wrapper {
                padding: 32px 16px;
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>🍱 개발한끼</h1>
        <p>
            오늘 올라온 기술 블로그 글을<br>
            원하는 시간에 메일로 받아보세요.
        </p>
    </div>

    <div class="info-box">
        <p>
            개발한끼는 카카오, 네이버, 토스 등<br>
            주요 기술 블로그의 새 글을 매일 수집해<br>
            <strong>당신이 원하는 시간</strong>에 이메일로 보내드립니다.
        </p>
        <p>
            기술 블로그를 매일 챙겨볼 필요 없이,<br>
            <strong>한 끼처럼</strong> 받아보세요.
        </p>
    </div>

    <!-- 폼 설정 -->
    <form id="subscribeForm" class="form-box">
        <input type="email" id="email" name="email" placeholder="이메일 주소를 입력해주세요" required>

        <label for="preferredSendTime" style="font-size:14px; color:#555; display:block; margin-bottom:4px;">
            받고 싶은 시간
        </label>
        <select name="preferredSendTime" id="preferredSendTime" required>
            <option value="06:00">오전 6시</option>
            <option value="07:00">오전 7시</option>
            <option value="08:00" selected>오전 8시</option>
            <option value="09:00">오전 9시</option>
            <option value="10:00">오전 10시</option>
            <option value="11:00">오전 11시</option>
            <option value="12:00">정오</option>
            <option value="13:00">오후 1시</option>
            <option value="14:00">오후 2시</option>
            <option value="15:00">오후 3시</option>
            <option value="16:00">오후 4시</option>
            <option value="17:00">오후 5시</option>
            <option value="18:00">오후 6시</option>
        </select>

        <button type="submit">오늘 올라온 글 받아보기 📬</button>
    </form>

    <div class="footer">
        뉴스레터는 무료이며 언제든 수신 거부할 수 있어요.<br>
        매일 정해진 시간에만 발송됩니다.
    </div>
</div>

<script>
    document.getElementById('subscribeForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const preferredSendTime = document.getElementById('preferredSendTime').value;

        const data = {
            email: email,
            preferredSendTime: preferredSendTime
        };

        fetch('/api/subscribe', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
            .then(response => {
                if (response.ok) {
                    alert('구독이 성공적으로 완료되었습니다!');

                    document.getElementById('email').value = '';
                    document.getElementById('preferredSendTime').value = '08:00';
                } else {
                    response.json().then(data => {
                        alert(data.message || '오류가 발생했습니다. 다시 시도해 주세요.');
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('네트워크 오류가 발생했습니다.');
            });
    });

</script>

</body>
</html>
